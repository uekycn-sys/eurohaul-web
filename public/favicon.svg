<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><clipPath id="favClip"><rect width="512" height="512" rx="112"/></clipPath></defs><g clip-path="url(#favClip)">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="55%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a1c1a"/>
    </linearGradient>
    <radialGradient id="sunset" cx="50%" cy="62%" r="55%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="256" cy="300" r="220" fill="url(#sunset)"/>
  <!-- Horizon road -->
  <polygon points="180,310 332,310 512,512 0,512" fill="url(#road)"/>
  <line x1="256" y1="320" x2="256" y2="512" stroke="#f59e0b" stroke-width="6" stroke-dasharray="22 18" stroke-opacity="0.7"/>
  <!-- Cab-over Euro Truck front silhouette -->
  <!-- Roof deflector -->
  <path d="M168 134 C174 114 196 106 256 106 C316 106 338 114 344 134 Z" fill="#ea580c"/>
  <!-- Main Cab Body -->
  <rect x="148" y="132" width="216" height="206" rx="28" fill="url(#cab)" stroke="#0f172a" stroke-width="6"/>
  <!-- Orange Racing Stripe -->
  <rect x="150" y="246" width="212" height="16" fill="#f97316"/>
  <!-- Panoramic Windshield -->
  <rect x="168" y="152" width="176" height="80" rx="14" fill="#0f172a"/>
  <path d="M180 162 L250 162 L212 222 L174 222 Z" fill="#38bdf8" fill-opacity="0.22"/>
  <!-- Grille -->
  <rect x="184" y="274" width="144" height="44" rx="8" fill="#1e293b"/>
  <g stroke="#475569" stroke-width="4">
    <line x1="196" y1="286" x2="316" y2="286"/>
    <line x1="196" y1="296" x2="316" y2="296"/>
    <line x1="196" y1="306" x2="316" y2="306"/>
  </g>
  <!-- Glowing Headlights -->
  <rect x="160" y="294" width="32" height="18" rx="6" fill="#fef08a"/>
  <rect x="320" y="294" width="32" height="18" rx="6" fill="#fef08a"/>
  <!-- Side Mirrors -->
  <rect x="122" y="160" width="18" height="62" rx="7" fill="#334155"/>
  <rect x="372" y="160" width="18" height="62" rx="7" fill="#334155"/>
  <!-- Bumper & Tires -->
  <rect x="152" y="338" width="44" height="36" rx="10" fill="#0f172a"/>
  <rect x="316" y="338" width="44" height="36" rx="10" fill="#0f172a"/>
</g></svg>